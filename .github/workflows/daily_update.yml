name: Günlük Resmi Gazete Botu

on:
schedule:
- cron: '0 1 * * *'

workflow_dispatch:

jobs:
run-bot:
runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Repoyu Klonla
    # Versiyon v4 olarak güncellendi (Uyarıyı çözer)
    uses: actions/checkout@v4

  - name: Python Kur
    # Versiyon v5 olarak güncellendi (Uyarıyı çözer)
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Kütüphaneleri Yükle
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 PyPDF2 google-generativeai

  - name: Botu Çalıştır
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python resmi_gazete_bot.py

  - name: Değişiklikleri Github'a Yükle (Commit & Push)
    run: |
      git config --global user.name 'ResmiGazeteBot'
      git config --global user.email 'bot@resmigazeteozet.local'
      git add data.js
      git diff --quiet && git diff --staged --quiet || (git commit -m "Günlük otomatik güncelleme: data.js" && git push)
