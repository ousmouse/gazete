name: Gunluk Resmi Gazete Botu

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Bu yetkinin tanımlı olması şart
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Git push için gerekli

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 PyPDF2 google-generativeai

      - name: Botu Calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python resmi_gazete_bot.py

      - name: Degisiklikleri Github'a Yukle
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.js
          # Eğer değişiklik varsa commit at
          if ! git diff --cached --quiet; then
            git commit -m "Otomatik guncelleme: data.js"
            git push
          else
            echo "Değişiklik yok, commit atılmadı."
          fi
