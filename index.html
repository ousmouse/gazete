<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugün Neler Oldu? - Yeni Nesil Resmi Gazete</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6', // Soft Violet
                            600: '#7c3aed',
                            900: '#4c1d95',
                        },
                        surface: '#f8fafc'
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 40px -5px rgba(139, 92, 246, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f4f5; /* Çok açık gri/kırık beyaz */
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }
        /* Gizli Scrollbar ama kaydırılabilir */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .bento-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col">

    <header class="glass-nav border-b border-white/40 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-20 flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center gap-3 cursor-pointer">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-brand-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30 transform rotate-3 hover:rotate-0 transition-transform">
                        <i class="ph-bold ph-lightning text-xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <h1 class="font-bold text-xl tracking-tight text-slate-800 leading-none">Resmi Gazete<span class="text-brand-500">.</span></h1>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">fakat sade ve anlaşılır</span>
                    </div>
                </div>
                
                <!-- Sağ Menü -->
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex flex-col text-right">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">31 Temmuz 2026</span>
                        <span class="text-sm font-bold text-slate-700">Cuma</span>
                    </div>
                    <button class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-brand-500 hover:border-brand-200 hover:bg-brand-50 transition-all shadow-sm">
                        <i class="ph-bold ph-bell-ringing"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        
        <!-- Üst Karşılama ve Filtreler -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
            <div class="max-w-xl">
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight mb-3">Bugünün Önemli Kararları</h2>
                <p class="text-slate-500 text-lg leading-relaxed">Bürokrasi jargonuna takılmadan; sade, net ve herkesin anlayacağı dilde Resmi Gazete özetleri.</p>
            </div>
            
            <!-- Eğlenceli Hap Filtreler (Pills) -->
            <div class="flex flex-wrap items-center gap-2" id="filterContainer">
                <!-- JS ile doldurulacak -->
            </div>
        </div>

        <div id="bentoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 auto-rows-[minmax(180px,auto)]">
            <!-- JS ile doldurulacak -->
        </div>

    </main>

    <!-- VERİYİ DIŞARIDAN ALIYORUZ -->
    <script src="data.js"></script>

    <script>
        // Kategori Renk Eşleştirmeleri (Tailwind classları)
        const themeColors = {
            'rose': { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-100', iconBg: 'bg-rose-100', hover: 'hover:border-rose-300' },
            'emerald': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-100', iconBg: 'bg-emerald-100', hover: 'hover:border-emerald-300' },
            'violet': { bg: 'bg-violet-50', text: 'text-violet-700', border: 'border-violet-100', iconBg: 'bg-violet-100', hover: 'hover:border-violet-300' },
            'amber': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-100', iconBg: 'bg-amber-100', hover: 'hover:border-amber-300' },
            'blue': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-100', iconBg: 'bg-blue-100', hover: 'hover:border-blue-300' },
            'default': { bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-200', iconBg: 'bg-slate-200', hover: 'hover:border-slate-300' }
        };

        let currentFilter = 'Tümü';
        const categories = ['Tümü', 'Kanun', 'Yönetmelik', 'Atama', 'Cumhurbaşkanı Kararı', 'Tebliğ'];

        function createBentoCard(item) {
            const theme = themeColors[item.color] || themeColors['default'];
            
            // Tüm kartlar eşit boyutta (1 kolon) kaplayacak
            const gridClass = "col-span-1 flex flex-col justify-between";
            const titleClass = "text-xl";

            return `
                <div class="bento-card ${gridClass} ${theme.bg} bg-opacity-30 rounded-3xl border ${theme.border} p-6 sm:p-8 shadow-sm relative overflow-hidden group hover:shadow-md hover:border-opacity-100 transition-all duration-300">
                    <!-- Arka plan hafif gradient dekorasyonu -->
                    <div class="absolute -top-16 -right-16 w-32 h-32 rounded-full ${theme.iconBg} opacity-60 blur-2xl group-hover:scale-125 transition-transform duration-500 pointer-events-none"></div>
                    
                    <div class="relative z-10 flex flex-col h-full">
                        <!-- Üst Etiket -->
                        <div class="flex items-start justify-between mb-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white bg-opacity-70 backdrop-blur-sm ${theme.text} text-xs font-bold uppercase tracking-wide shadow-sm border border-white">
                                <span>${item.emoji}</span> ${item.category}
                            </span>
                            
                            <button class="text-slate-400 hover:${theme.text} transition-colors p-1 bg-white bg-opacity-50 rounded-full hover:bg-white" title="Kaydet">
                                <i class="ph-bold ph-bookmark-simple text-xl"></i>
                            </button>
                        </div>
                        
                        <!-- Başlık ve Özet -->
                        <h3 class="${titleClass} font-extrabold text-slate-800 leading-snug mb-3 tracking-tight group-hover:${theme.text} transition-colors">
                            ${item.title}
                        </h3>
                        
                        <p class="text-slate-600 text-sm sm:text-base leading-relaxed mb-6 flex-grow">
                            ${item.summary}
                        </p>
                        
                        <!-- Alt Bilgi: Kimi Etkiler & Buton -->
                        <div class="mt-auto pt-4 border-t ${theme.border} border-opacity-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="flex-grow">
                                <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">💡 Kimi Etkiliyor?</span>
                                <span class="text-sm font-semibold text-slate-700 bg-white bg-opacity-50 px-2 py-1 rounded-md inline-block">${item.impact}</span>
                            </div>
                            
                            <button class="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-white hover:${theme.bg} ${theme.text} rounded-xl transition-colors shadow-sm border border-transparent hover:${theme.border}">
                                <i class="ph-bold ph-arrow-up-right text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            container.innerHTML = '';

            categories.forEach(cat => {
                const isActive = currentFilter === cat;
                const baseClasses = "px-4 py-2 rounded-full text-sm font-bold transition-all duration-200 cursor-pointer select-none border";
                
                const activeClasses = isActive 
                    ? "bg-slate-800 text-white border-slate-800 shadow-md transform scale-105" 
                    : "bg-white text-slate-600 border-slate-200 hover:border-slate-300 hover:bg-slate-50";

                const btn = document.createElement('button');
                btn.className = `${baseClasses} ${activeClasses}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentFilter = cat;
                    renderFilters(); // Buton stillerini güncelle
                    renderGrid();    // Kartları güncelle
                };
                
                container.appendChild(btn);
            });
        }

        function renderGrid() {
            const container = document.getElementById('bentoGrid');
            container.innerHTML = '';
            
            const filteredData = currentFilter === 'Tümü' 
                ? mockData 
                : mockData.filter(item => item.category === currentFilter);
                
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center bg-white rounded-3xl border border-dashed border-slate-300">
                        <div class="text-6xl mb-4">😴</div>
                        <h3 class="text-xl font-bold text-slate-700 mb-2">Bu kategoride hareket yok</h3>
                        <p class="text-slate-500">Bugün bu alanda resmi bir karar yayımlanmamış.</p>
                        <button onclick="currentFilter='Tümü'; renderFilters(); renderGrid();" class="mt-6 px-6 py-2 bg-brand-50 text-brand-600 font-bold rounded-full hover:bg-brand-100 transition-colors">
                            Tümüne Dön
                        </button>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                container.innerHTML += createBentoCard(item);
            });
        }

        // Sayfa yüklendiğinde başlat
        window.onload = () => {
            renderFilters();
            renderGrid();
        };

    </script>
</body>
</html>
